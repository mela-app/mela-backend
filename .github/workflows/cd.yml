name: backend-cd

# Builds the API image, pushes it to GHCR, then applies the migrations and
# restarts just the API on the production server (infra/production). The
# admin console, the web player, Caddy, Postgres and Redis keep running - see
# docs/deployment.md in mela-admin-web.
#
# Secrets (repository or organization): SERVER_HOST, SERVER_USER,
# SERVER_SSH_KEY (or SERVER_PASSWORD), SERVER_SSH_FINGERPRINT, DEPLOY_PATH.

on:
  push:
    branches:
      - main
    # What goes into the image - not docs, infra or the dev compose file.
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd.yml'
  workflow_dispatch:  # Redeploy the API unchanged, from the Actions tab

# One deploy of the API at a time.
concurrency:
  group: cd-production-backend
  cancel-in-progress: false

jobs:
  build-and-deploy-production:
    name: Build and deploy the API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha,scope=mela-backend
          cache-to: type=gha,mode=max,scope=mela-backend
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/mela-backend:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/mela-backend:${{ github.sha }}

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          # A deploy key; the password is only a fallback while there is none.
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # The server's host key, so nothing else can pose as it.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script_stop: true
          script: |
            echo "Deploying the API..."

            # The server pulls with its own read-only registry login
            # (docs/deployment.md): no token of this job is left behind there.
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull backend
            # Migrations and the super-admin seed run on the new image, before
            # it serves anything; the migrate service shares that image.
            docker compose run --rm -T migrate
            # Only the API: --no-deps leaves everything else alone.
            docker compose up -d --no-deps backend
            docker compose ps backend
