# Production LiveKit on a server of its own. On that server, from this
# folder: `docker compose up -d`. (On the same server as the API, set
# COMPOSE_PROFILES=livekit in infra/production instead.) See
# docs/features/video-provider.md ("Self-hosting LiveKit").
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # WebRTC needs the host's real UDP ports and public IP (LiveKit's
    # recommended setup), so no Docker port mapping.
    network_mode: host
    # LIVEKIT_KEYS (see .env.example).
    env_file: .env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
